version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cobalt-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/cobalt.db
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=cobalt
      - KEYCLOAK_CLIENT_ID=cobalt-observatory
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - OTEL_ENDPOINT=${OTEL_ENDPOINT:-}
      - OTEL_SERVICE_NAME=cobalt-observatory
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - DEBUG=false
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - cobalt-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cobalt-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - cobalt-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: cobalt-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cobalt-network

volumes:
  backend-data:
  keycloak-data:

networks:
  cobalt-network:
    driver: bridge